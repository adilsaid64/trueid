[workspace]
resolver = "3"
members = [
    "crates/trueid-core",
    "crates/trueid-ipc",
    "crates/trueid-daemon",
    "crates/trueid-ctl",
    "crates/trueid-pam",
]

[workspace.dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tracing = "0.1"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
tag-prefix = ""
publish = false
push = true
consolidate-commits = true
pre-release-commit-message = "chore(release): release {{version}}"
